# Whitelisted query templates (spec §16, item 17).
#
# The router NEVER generates Cypher. A model may only choose a template id and fill its
# declared parameters; anything else falls back to cited document search. This is what
# keeps the hard rules enforceable: a template that answers a compliance question cannot
# traverse a tier-4 edge, and a template scoped to India cannot return an EU rule,
# because the Cypher is written once, here, and reviewed.
#
# tier_floor = the WORST tier this answer depends on. Compliance answers must be 1.

- id: manufacturers_for_category_in_cluster
  flow: buyer
  intent: >
    Find manufacturers that hold a COS-8/COS-9 LICENCE for a product category. Use only
    when the question is about licensing or legal permission to manufacture.
  examples:
    - "COS-8 licensed skin care manufacturers in Baddi"
    - "which factories are licensed for face cream in Gujarat"
  params: {category: category_code, cluster: cluster_id, district: district}
  tier_floor: 1
  cypher: |
    MATCH (c:Company)-[:OPERATES]->(f:Facility)-[:LICENSED_UNDER]->(l:Licence)
          -[:PERMITS]->(pc:ProductCategory {code: $category})
    MATCH (f)-[:LOCATED_IN]->(cl:Cluster)
    WHERE ($cluster IS NULL OR cl.cluster_id = $cluster)
      AND ($district IS NULL OR toUpper(f.district) = $district)
      AND l.status <> 'cancelled'
      // 907 of the 911 CDSCO rows are DRUG licences (Form 25/28 family). Without this
      // the template answers "licensed to manufacture cosmetics" with a pharma licence.
      AND l.regime = 'cosmetics'
    RETURN c.legal_name AS company, l.form_type AS licence_form, l.number AS licence_no,
           l.status AS licence_status, f.address_raw AS address, cl.name AS cluster,
           c.trust_level AS trust
    ORDER BY trust DESC LIMIT $limit

- id: cosmetics_firms_in_cluster
  flow: buyer
  intent: Cosmetics manufacturers in a cluster from the registry, where no licence is on file
  examples:
    - "cosmetics manufacturers in Surat"
    - "who makes cosmetics in the Ahmedabad cluster"
  params: {cluster: cluster_id, district: district}
  tier_floor: 1
  note: >
    Registry activity, NOT a licence. Answers "who is in this business here", never
    "who may legally make this". The licence question is the template above.
    `evidence_basis` matters: Udyam records the activity a firm declares NOW, while the
    NIC inside a CIN is what the company registered as AT INCORPORATION and is never
    updated — HIMACHAL FURNITURES PVT LTD carries the perfumes-and-toilet-preparations
    code to this day. Incorporation-only rows are kept, because they are real leads, but
    they rank last and say so.
  cypher: |
    MATCH (c:Company)-[:LOCATED_IN]->(cl:Cluster)
    WHERE ($cluster IS NULL OR cl.cluster_id = $cluster)
      AND ($district IS NULL OR toUpper(c.district) = $district)
      AND ('cosmetics_core' IN c.roles OR 'manufacturer_candidate' IN c.roles
           OR 'manufacturer_candidate_at_incorporation' IN c.roles)
    WITH c, cl,
         CASE
           WHEN 'cosmetics_core' IN c.roles THEN 'current Udyam activity — cosmetics'
           WHEN 'manufacturer_candidate' IN c.roles THEN 'current Udyam activity — 2023x manufacture'
           ELSE 'NIC recorded at incorporation only (may be stale)'
         END AS evidence_basis,
         CASE
           WHEN 'cosmetics_core' IN c.roles THEN 0
           WHEN 'manufacturer_candidate' IN c.roles THEN 1
           ELSE 2
         END AS rank
    RETURN c.legal_name AS company, c.district AS district, cl.name AS cluster,
           evidence_basis, c.roles AS roles, c.trust_level AS trust,
           2 IN c.trust_rungs AS has_licence_evidence
    ORDER BY rank, trust DESC, company LIMIT $limit

- id: loan_licence_partners
  flow: buyer
  intent: >
    Firms tied to a given company by a LOAN LICENCE on the CDSCO register — i.e. one of
    the pair manufactures for the other. Use for "who does X manufacture for", "who makes
    X's product", "loan licence", "is X a contract manufacturer for anyone".
  examples:
    - "who is Encube Ethicals linked to by a loan licence"
    - "loan licence partners of Cipla"
  params: {company: company_name}
  tier_floor: 1
  cypher: |
    MATCH (a:Company)-[e:LOAN_LICENCE_WITH]->(b:Company)
    WHERE toUpper(a.legal_name) CONTAINS toUpper($company)
    RETURN a.legal_name AS company, b.legal_name AS partner,
           e.licence_form AS licence_form, e.licence_no AS licence_no,
           e.regime AS regime,
           // The register names both firms but not which owns the site. Say so in the
           // row itself so an answer cannot quietly assert a direction it cannot know.
           'register names both firms; it does NOT say which one owns the factory'
             AS direction_caveat
    ORDER BY partner LIMIT $limit

- id: third_party_manufacturers
  flow: buyer
  intent: >
    Find CONTRACT manufacturers — companies that make product for someone else's brand.
    Use for "third party manufacturing", "private label", "white label", "contract
    manufacturer", "who can make my product".
  examples:
    - "third party manufacturer for a face serum in Baddi"
    - "private label cream manufacturing"
    - "who can manufacture my skincare brand"
  params: {cluster: cluster_id, district: district}
  tier_floor: 2
  cypher: |
    MATCH (c:Company)-[e:CLAIMS_CAPABILITY]->(p:ProcessCapability
          {capability_id: 'third_party_manufacturing'})
    OPTIONAL MATCH (c)-[:LOCATED_IN]->(cl:Cluster)
    // WITH ... WHERE, never OPTIONAL MATCH ... WHERE: a WHERE placed directly after an
    // OPTIONAL MATCH becomes part of that optional pattern and filters NOTHING, so the
    // cluster constraint was silently ignored and Baddi returned nationwide results.
    WITH c, e, cl
    WHERE ($cluster IS NULL OR cl.cluster_id = $cluster)
      AND ($district IS NULL OR toUpper(c.district) = $district)
    RETURN c.legal_name AS company, c.website AS website, cl.name AS cluster,
           e.evidence AS claimed_on_their_site, c.trust_level AS trust
    ORDER BY trust DESC LIMIT $limit

- id: packaging_converters_in_cluster
  flow: buyer
  intent: Who can supply packaging (bottles, jars, tubes, cartons, closures) in a cluster
  examples:
    - "who makes cosmetic bottles in Palghar"
    - "packaging suppliers near Ahmedabad"
  params: {component: packaging_type, cluster: cluster_id, district: district}
  tier_floor: 1
  cypher: |
    MATCH (c:Company)-[:SUPPLIES_PACKAGING]->(p:PackagingComponent)
    MATCH (c)-[:LOCATED_IN]->(cl:Cluster)
    WHERE ($cluster IS NULL OR cl.cluster_id = $cluster)
      AND ($district IS NULL OR toUpper(c.district) = $district)
      AND ($component IS NULL OR p.type = $component)
    RETURN c.legal_name AS company, p.type AS component, c.district AS district,
           cl.name AS cluster, c.trust_level AS trust
    ORDER BY trust DESC, company LIMIT $limit

- id: suppliers_of_ingredient
  flow: buyer
  intent: Which Indian companies supply a named cosmetic ingredient
  examples:
    - "Indian suppliers of Niacinamide"
    - "who sells hyaluronic acid"
  params: {ingredient: inci_name}
  tier_floor: 3
  note: Observed on the supplier's own catalogue. Tier 3 — ranks and suggests, never proves.
  cypher: |
    MATCH (c:Company)-[e:SUPPLIES]->(i:Ingredient)
    WHERE ($ingredient IS NULL OR i.inci_name = $ingredient) AND e.cosmetics_relevant
    RETURN i.inci_name AS ingredient, c.legal_name AS supplier, c.website AS website,
           e.mode AS mode, e.evidence AS evidence, c.trust_level AS trust
    ORDER BY trust DESC LIMIT $limit

- id: ingredient_restriction_india
  flow: compliance
  intent: Is an ingredient restricted or prohibited in INDIA
  examples:
    - "is mercury allowed in cosmetics in India"
    - "India restrictions on hydroquinone"
  params: {ingredient: inci_name}
  tier_floor: 1
  cypher: |
    MATCH (i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule {jurisdiction: 'IN'})
    WHERE ($ingredient IS NULL OR i.inci_name = $ingredient)
      // same discipline as the EU side: a blanket note is not a substance restriction
      AND NOT coalesce(r.applies_to_group, false)
    OPTIONAL MATCH (r)-[:SUPPORTED_BY]->(d:DocChunk)
    RETURN i.inci_name AS ingredient, r.status AS status, r.clause AS clause,
           r.source_doc AS source, r.conditions AS conditions,
           collect(DISTINCT d.page)[..3] AS cited_pages
    LIMIT $limit

- id: ingredient_restriction_eu
  flow: compliance
  intent: >
    What the EU permits, restricts or prohibits for an ingredient (explicitly EU-only,
    no force in India). Use for both directions of the question — "is X restricted" and
    "what does the EU allow for X" ask the same thing of the same annexes, and only the
    first phrasing was being recognised.
  examples:
    - "EU restrictions on salicylic acid"
    - "what does the EU allow for salicylic acid"
    - "what is the EU limit on phenoxyethanol"
  params: {ingredient: inci_name}
  tier_floor: 1
  cypher: |
    MATCH (i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule {jurisdiction: 'EU'})
    WHERE ($ingredient IS NULL OR i.inci_name = $ingredient)
      // A blanket EU note ("ban substances that deplete the ozone layer") is attached to
      // thousands of ingredients and says nothing about any one of them — it reported
      // AQUA and SODIUM CHLORIDE as EU-restricted. Only substance-specific annex entries
      // support the claim "this ingredient is restricted".
      AND NOT coalesce(r.applies_to_group, false)
    RETURN i.inci_name AS ingredient, r.status AS status, r.clause AS clause,
           r.max_concentration AS max_concentration, r.conditions AS conditions,
           'EU only — EC 1223/2009 has no force in India' AS jurisdiction_warning
    LIMIT $limit

- id: standard_for_category
  flow: compliance
  intent: Which BIS/IS standard applies to a product category in India
  examples:
    - "what standard applies to skin creams"
    - "IS standard for shampoo"
  params: {category: category_code}
  tier_floor: 1
  note: >
    The Ninth Schedule attaches a standard to the 16 spine categories; the Fourth
    Schedule's 80 entries are the leaves beneath them. So a question about a leaf —
    toothpaste, mouth wash, nail varnish — is answered by its parent's standard, and
    `applies_at` says which level the standard was actually written for. Matching the
    leaf alone returned nothing for 80 of the 96 categories.
  cypher: |
    MATCH (asked:ProductCategory)
    WHERE $category IS NULL OR asked.code = $category
    // walk up to the level the Ninth Schedule actually writes standards at
    OPTIONAL MATCH (asked)-[:CHILD_OF]->(parent:ProductCategory)
    WITH asked, parent
    UNWIND [asked, parent] AS pc
    WITH DISTINCT asked, pc WHERE pc IS NOT NULL
    MATCH (pc)-[:GOVERNED_BY]->(r:RegulatoryRule {jurisdiction: 'IN'})
    // The Fourth Schedule rule that DEFINES a category is also a GOVERNED_BY edge and
    // carries no standard. It is not an answer to "which standard applies".
    WHERE r.standard_ref IS NOT NULL
    RETURN asked.name AS asked_about, pc.code AS category, pc.name AS category_name,
           CASE WHEN pc = asked THEN 'this category'
                ELSE 'its parent category — the Ninth Schedule writes the standard here'
           END AS applies_at,
           r.standard_ref AS indian_standard, r.clause AS clause, r.source_doc AS source
    ORDER BY asked_about, category LIMIT $limit

- id: loan_licence_holders
  flow: buyer
  intent: >
    Licences on the register flagged as LOAN licences. NOTE: the register does not say
    which party owns the premises, so this lists the licence and both named firms — it
    does NOT establish that the named company is a brand rather than the factory.
  examples:
    - "who holds a COS-9 loan licence"
  params: {}
  tier_floor: 1
  cypher: |
    MATCH (f:Facility)-[:LICENSED_UNDER]->(l:Licence)
    WHERE l.is_loan_licence = true
    OPTIONAL MATCH (c:Company)-[:OPERATES]->(f)
    // 146 of the 150 loan licences on this register are DRUG licences. Returning the
    // regime keeps a pharma loan licence from being read as a cosmetics one.
    WITH l, c, f
    RETURN l.form_type AS form, l.number AS licence_no, l.sla_state AS state,
           l.regime AS regime, c.legal_name AS named_company, f.address_raw AS premises,
           'register does NOT say which party owns these premises' AS direction_caveat
    ORDER BY regime, form LIMIT $limit

- id: substitutes_for_ingredient
  flow: formulation
  intent: What other ingredients share a function with this one
  examples:
    - "alternatives to parabens"
    - "what can replace phenoxyethanol"
  params: {ingredient: inci_name}
  tier_floor: 4
  note: >
    Tier 4 — derived from shared declared function. Ranks and suggests. It is NOT a
    compliance answer and must never be presented as one.
  cypher: |
    MATCH (i:Ingredient {inci_name: $ingredient})-[s:SUBSTITUTE_FOR]->(alt:Ingredient)
    RETURN alt.inci_name AS substitute, s.shared_functions AS shared_functions,
           s.rule_id AS derived_by,
           EXISTS { (alt)-[:RESTRICTED_BY]->(rr:RegulatoryRule {jurisdiction:'IN'})
                    WHERE NOT coalesce(rr.applies_to_group, false) }
             AS restricted_in_india
    LIMIT $limit

- id: company_profile
  flow: both
  intent: Everything known about one company, with provenance
  examples:
    - "tell me about Galaxy Surfactants"
  params: {company: company_name}
  tier_floor: 1
  cypher: |
    MATCH (c:Company)
    WHERE toUpper(c.legal_name) CONTAINS toUpper($company)
       OR toUpper(coalesce(c.norm_name,'')) CONTAINS toUpper($company)
    OPTIONAL MATCH (c)-[:OPERATES]->(f:Facility)-[:LICENSED_UNDER]->(l:Licence)
    OPTIONAL MATCH (c)-[:MEMBER_OF]->(a:Association)
    OPTIONAL MATCH (c)-[:CLAIMS_CAPABILITY]->(p:ProcessCapability)
    OPTIONAL MATCH (c)-[:CLAIMS_CERTIFICATION]->(ce:Certification)
    RETURN c.legal_name AS company, c.cin AS cin, c.gstins AS gstins,
           c.district AS district, c.cluster_id AS cluster, c.website AS website,
           c.roles AS roles, c.trust_level AS trust_level,
           c.trust_rungs AS trust_rungs, c.trust_reasons AS why,
           collect(DISTINCT l.form_type + ' ' + l.number) AS licences,
           collect(DISTINCT a.name) AS associations,
           collect(DISTINCT p.capability_id) AS capabilities,
           collect(DISTINCT ce.cert_id) AS certifications
    LIMIT $limit

- id: eu_restricted_in_indian_products
  flow: compliance
  intent: Ingredients restricted in the EU that appear in products on Indian shelves
  examples:
    - "EU banned ingredients still sold in India"
  params: {}
  tier_floor: 1
  cypher: |
    MATCH (p:Product)-[:CONTAINS]->(i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule)
    WHERE r.jurisdiction = 'EU'
      AND NOT EXISTS { (i)-[:RESTRICTED_BY]->(:RegulatoryRule {jurisdiction:'IN'}) }
      // A blanket EU note ("ban substances that deplete the ozone layer") is attached to
      // thousands of ingredients and says nothing about any one of them — it reported
      // AQUA and SODIUM CHLORIDE as EU-restricted. Only substance-specific annex entries
      // support the claim "this ingredient is restricted".
      AND NOT coalesce(r.applies_to_group, false)
    RETURN i.inci_name AS ingredient, r.status AS eu_status, r.clause AS eu_clause,
           count(DISTINCT p) AS indian_products,
           'EU_ONLY — no equivalent India rule in this graph' AS jurisdiction_note
    ORDER BY indian_products DESC LIMIT $limit

- id: testing_labs_for_cosmetics
  flow: compliance
  intent: Where can I get a cosmetic product tested, by an accredited lab
  examples:
    - "where can I test my face cream"
    - "NABL labs for cosmetics testing in Maharashtra"
    - "accredited cosmetics testing laboratory near Ahmedabad"
  params: {state: state, cluster: cluster_id, district: district}
  tier_floor: 1
  note: >
    Accreditation scope comes from NABL's own register, so "accredited for cosmetics"
    means the Cosmetics & Essential Oils / AYUSH / Soap-Detergent-Toiletries scope
    specifically — not merely that the lab is accredited for something. `cosmetics_scope`
    names the scope that qualified the lab, so the answer cites the accreditation it is
    relying on. A multi-site lab holds that scope at ONE of its `accredited_sites`; the
    register does not say which, so confirm the site before booking a test.
  cypher: |
    MATCH (c:Company)-[a:ACCREDITED_AS]->(ce:Certification)
    WHERE a.tests_cosmetics
    OPTIONAL MATCH (c)-[:LOCATED_IN]->(cl:Cluster)
    WITH c, a, ce, cl
    WHERE ($cluster IS NULL OR cl.cluster_id = $cluster)
      AND ($state IS NULL OR c.state = $state)
      AND ($district IS NULL OR toUpper(c.district) = $district)
    WITH c, a, ce,
         // Decision 0009 counts AYUSH and Soap-Detergent-Toiletries as a cosmetics
         // scope, and that stands — but a lab holding "Cosmetics & Essential Oils"
         // itself is the better answer to "where do I test my face cream", and
         // alphabetical order buried all 145 of them among the 56 that qualify only
         // by an adjacent scope. Rank, do not filter: the definition is unchanged.
         CASE WHEN any(g IN a.groups_matched WHERE g CONTAINS 'COSMETIC')
              THEN 0 ELSE 1 END AS scope_rank
    RETURN c.legal_name AS laboratory, c.state AS state, c.district AS district,
           a.certificate_number AS certificate, a.valid_till AS valid_till,
           a.groups_matched AS cosmetics_scope, a.accredited_sites AS accredited_sites,
           a.disciplines AS disciplines, a.groups AS accredited_scope
    ORDER BY scope_rank, laboratory LIMIT $limit
