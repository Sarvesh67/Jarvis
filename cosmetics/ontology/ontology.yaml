# Single source of truth for the cosmetics graph schema.
# constraints.cypher is GENERATED from this file (pipeline/gen_constraints.py) — never hand-edit it.
version: 2
jurisdictions: [IN, EU]

# Provenance envelope carried on every property group and every edge (spec §3).
provenance_envelope:
  fields: [source_id, retrieved_at, tier, confidence, valid_from, valid_to]
  tiers:
    1: regulator
    2: company-declared
    3: observed/scraped
    4: inferred

nodes:
  Company:
    key: [company_id]
    indexes: [norm_name, trust_level, trust_grade, pincode]
    properties:
      legal_name: str
      norm_name: str
      cin: str
      gstins: list             # PUBLIC form: a personal-PAN GSTIN is masked, 24••••••••••1ZZ
      pan: str                 # never set for a personal PAN (proprietorship, HUF) — DPDP
      is_proprietorship: bool  # from GSTIN char 6 = P; set only where a GSTIN is held
      udyam_no: str
      iec: str
      constitution: str        # proprietorship | partnership | llp | pvt_ltd | public_ltd
      roles: list              # ADDITIVE array, never a node label (hard rule 1)
      website: str
      trust_level: int         # L0..L6, DEPRECATED 2026-10-31: kept one release, use trust_grade
      trust_grade: str         # flagged | G0..G4 — ordered and monotonic (TRUST_PLAN §6.1)
      trust_grade_label: str   # the card line; describes our evidence, never the supplier
      trust_publishers: int    # independent publishers that agree (trust/families.py)
      trust_licence: str       # verified | claimed | unknown | adverse (facets, §6.3)
      trust_activity: str
      trust_track: str
      trust_lines: list        # public evidence lines, "facet: text" — public rows only
      gst_status: str          # public form only: Active / could not be confirmed (§7.1)
      gst_verified_at: datetime
      # NEVER here: filing periods or streaks. They are private (hard rule 7, §7.1), and
      # the agent's Cypher can read anything on this node.
  Facility:
    key: [facility_id]
    indexes: [pincode, cluster_id]
    properties:
      firm_name: str
      norm_name: str
      address_raw: str
      pincode: str
      district: str
      state: str
      cluster_id: str
      gmp_schedule: str
      geo_confidence: str
  Licence:
    key: [form_type, number, sla_state]
    properties:
      granted_on: date
      expires_on: date
      categories: list
      status: str              # active | suspended | cancelled | unknown (default unknown)
      is_loan_licence: bool
      regime: str              # cosmetics | drugs | ayush
  Ingredient:
    key: [inci_name]
    indexes: [cas_primary]
    properties:
      cas: list
      ec_no: str
      functions: list
      origin_type: str
      cosing_ref: str
  ProductCategory:
    key: [code]
    properties: {name: str, source_vocab: str, parent_code: str}
  Cluster:
    key: [cluster_id]
    properties: {name: str, state: str, districts: list, pincode_ranges: list}
  # --- attachment nodes ---
  ProcessCapability: {key: [capability_id], properties: {kind: str, detail: str}}
  PackagingComponent: {key: [component_id], properties: {type: str, volume_ml: float, material: str}}
  Certification:   {key: [cert_id], properties: {name: str, body: str, valid_to: date}}
  TradeName:       {key: [name, supplier_id], properties: {supplier_name: str}}
  RegulatoryRule:
    key: [rule_id]
    indexes: [jurisdiction]
    required: [jurisdiction]   # HARD RULE 2 — enforced by an existence check in validate/checks.py
    properties:
      jurisdiction: str        # IN | EU
      source_doc: str
      clause: str
      scope: str               # ingredient | category
      status: str
      max_concentration: str
      conditions: str
      standard_ref: str
      applies_to_group: bool
  Product:     {key: [product_id], properties: {name: str, brand: str, source: str}}
  Signal:      {key: [signal_id], properties: {type: str, detail: str, observed_at: datetime}}
  TradeFlow:   {key: [flow_id], properties: {hs_code: str, direction: str, period: str}}
  Association: {key: [name], properties: {full_name: str}}
  Event:       {key: [name, edition, year], properties: {city: str}}
  DocChunk:
    key: [chunk_id]
    vector_index: {property: embedding, dimensions: 768, similarity: cosine}
    properties: {text: str, doc_id: str, page: int, section: str}
  # Person is DELIBERATELY ABSENT — hard rule 4: people live in Postgres only.

edges:
  - {type: OPERATES,                  from: Company,         to: Facility,        note: "inferred join; score >= 0.92 or shared GSTIN/pincode"}
  - {type: LICENSED_UNDER,            from: Facility,        to: Licence}
  - {type: PERMITS,                   from: Licence,         to: ProductCategory}
  - {type: LOCATED_IN,                from: Facility,        to: Cluster}
  - {type: HAS_CAPABILITY,            from: Facility,        to: ProcessCapability}
  - {type: CERTIFIED_AS,              from: Facility,        to: Certification}
  # A company website evidences a claim by the COMPANY, not by a specific premises.
  # These carry the quoted sentence; the Facility-level edges above are derived (tier 4)
  # in Stage 6, and only where the company operates exactly one facility.
  - {type: SUPPLIES_PACKAGING,        from: Company,         to: PackagingComponent}
  # NABL accreditation is recorded by the accreditation body, so it is tier 1 and a
  # distinct edge from CLAIMS_CERTIFICATION, which is what a company says about itself.
  - {type: ACCREDITED_AS,             from: Company,         to: Certification, props: [certificate_number, valid_till, groups]}
  - {type: CLAIMS_CAPABILITY,         from: Company,         to: ProcessCapability, props: [evidence]}
  - {type: CLAIMS_CERTIFICATION,      from: Company,         to: Certification,     props: [evidence]}
  - {type: MAPS_TO_INCI,              from: TradeName,       to: Ingredient}
  - {type: SUPPLIES,                  from: Company,         to: Ingredient,      props: [mode]}
  - {type: DISTRIBUTES_FOR,           from: Company,         to: Company}
  - {type: MARKETS,                   from: Company,         to: Product}
  - {type: CONTAINS,                  from: Product,         to: Ingredient,      props: [position]}
  - {type: IN_CATEGORY,               from: Product,         to: ProductCategory}
  - {type: HOLDS_LOAN_LICENCE_AT,     from: Company,         to: Facility}
  - {type: THIRD_PARTY_MANUFACTURED_BY, from: Company,       to: Company}
  # A loan licence names TWO firms, but the CDSCO register does not reliably say which
  # one owns the site: state FDAs fill 'Premise Name' / 'Loan Premises Name' in opposite
  # conventions, and the same firm appears on both sides in different rows. So the
  # PAIRING is tier 1 and the DIRECTION is unknown -- this edge asserts only the pairing
  # and is written in both directions with direction_known:false. Anything that needs to
  # know who owns the factory must use THIRD_PARTY_MANUFACTURED_BY, never this.
  - {type: LOAN_LICENCE_WITH,         from: Company,         to: Company,
     props: [licence_no, licence_form, regime, direction_known]}
  - {type: RESTRICTED_BY,             from: Ingredient,      to: RegulatoryRule, note: "substance-specific restrictions ONLY"}
  # Blanket regulatory notes that name no single substance. Deliberately a DIFFERENT edge
  # so that traversing RESTRICTED_BY can never imply a specific ingredient is restricted.
  - {type: SUBJECT_TO_GENERAL_RULE,   from: Ingredient,      to: RegulatoryRule}
  - {type: GOVERNED_BY,               from: ProductCategory, to: RegulatoryRule}
  - {type: MEMBER_OF,                 from: Company,         to: Association}
  - {type: EXHIBITED_AT,              from: Company,         to: Event}
  - {type: IMPORTED,                  from: Company,         to: TradeFlow}
  - {type: MENTIONS,                  from: DocChunk,        to: [Ingredient, Company, ProductCategory]}
  # A rule cites the paragraph that supports it — this is what makes a compliance answer
  # quotable rather than merely asserted.
  - {type: SUPPORTED_BY,              from: RegulatoryRule,  to: DocChunk}
  - {type: CHILD_OF,                  from: ProductCategory, to: ProductCategory}

derived_edges:                        # Stage 6 — all carry derived:true, rule_id, inputs[], tier:4
  - {type: SUBSTITUTE_FOR,       from: Ingredient, to: Ingredient}
  - {type: CAN_FILL,             from: Facility,   to: PackagingComponent}
  - {type: SERVES_CATEGORY,      from: Facility,   to: ProductCategory}
  - {type: IN_CLUSTER_WITH,      from: Company,    to: Company}
  - {type: LIKELY_MANUFACTURES_FOR, from: Company, to: Company}
  # What a firm SAYS it makes, mapped onto the Fourth Schedule spine. Its input is a
  # tier-2 claim carrying a quoted sentence, so it is better evidenced than the NIC
  # path — but it is still the company talking about itself, so it ranks and never
  # permits. PERMITS remains the only edge that may answer "is this firm allowed to".
  - {type: LIKELY_MAKES,         from: Company,    to: ProductCategory}
