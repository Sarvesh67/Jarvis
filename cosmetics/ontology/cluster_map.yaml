# district -> cluster_id. Districts are matched case-insensitively on the normalized
# district name from ref_pincode; pincode_prefixes are the fallback when a pincode
# resolves but its district string does not match (spelling varies across sources).
# wedge: true = the four clusters the product goes to market with.

