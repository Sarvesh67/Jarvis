    name: Baddi-Barotiwala-Nalagarh
    state: Himachal Pradesh
    wedge: true
    districts: [solan, sirmaur, sirmour]
    pincode_prefixes: ["1732", "1741", "1735", "1730"]
    note: Baddi 173205, Barotiwala 174103, Nalagarh 174101, Paonta Sahib 173025

