# Canonical category spine + source-string mappings (spec §7.5).
#
# The SPINE comes from the regulator: the Cosmetics Rules 2020 Fourth Schedule
# ("List of categories of cosmetics for import", 80 entries) is India's own category
# vocabulary, and the Ninth Schedule attaches BIS standards to finished forms.
# Retail / marketplace strings are TAGS. They never become spine codes.

spine:
  SKIN_CARE:       {name: Skin care, parent: null}
  SKIN_CLEANSING:  {name: Skin cleansing, parent: SKIN_CARE}
  SOAP:            {name: Soap and bathing bars, parent: SKIN_CLEANSING}
  HAIR_REMOVAL:    {name: Depilatories and epilation, parent: null}
  DEODORANT:       {name: Deodorants and antiperspirants, parent: null}
  SHAVING:         {name: Shaving and pre/after-shave, parent: null}
  MAKEUP:          {name: Make-up, parent: null}
  FRAGRANCE:       {name: Perfumes and colognes, parent: null}
  SUN_CARE:        {name: Sun and self-tanning, parent: null}
  HAIR_CARE:       {name: Hair and scalp care, parent: null}
  HAIR_COLOUR:     {name: Hair colouring, parent: HAIR_CARE}
  HAIR_STYLING:    {name: Hair styling, parent: HAIR_CARE}
  NAIL_CARE:       {name: Nail care and varnish, parent: null}
  ORAL_CARE:       {name: Oral and dental hygiene, parent: null}
  BABY_CARE:       {name: Baby and infant cosmetics, parent: null}
  TRADITIONAL:     {name: Traditional Indian cosmetics (bindi, kumkum, sindoor, kajal, henna), parent: null}

# Free-text -> spine code + tags. Sources: retail categories, OBF category tags,
# exhibitor/marketplace product strings, licence category strings.
