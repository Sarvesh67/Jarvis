# Golden queries — run by validate/checks.py and by pytest.
# `expect_min` is a FLOOR the current build must clear, not a target. Where coverage is
# genuinely thin the floor is 0 and `coverage_gap` names what would raise it, so a thin
# answer reads as a known gap rather than a silent pass.

- id: skin_care_manufacturers_in_wedge_cluster
  q: "COS-8 licensed skin-care manufacturers in a wedge cluster"
  shape: Facility->Licence + Facility->Cluster
  cypher: |
    MATCH (f:Facility)-[:LICENSED_UNDER]->(l:Licence)
    WHERE l.form_type IN ['COS-8','COS-9'] OR l.regime = 'cosmetics'
    OPTIONAL MATCH (f)-[:LOCATED_IN]->(c:Cluster)
    RETURN f.firm_name AS facility, l.form_type AS form, l.number AS licence,
           c.name AS cluster
  expect_min: 1
  coverage_gap: >
    No state FDA publishes a bulk COS-8/COS-9 list; CDSCO's approved-site listing carries
    only 4 cosmetics-regime rows. A state licence extract is the binding input.

- id: indian_suppliers_of_niacinamide
  q: "Indian suppliers of Niacinamide"
  shape: Company-[:SUPPLIES]->Ingredient
  cypher: |
    MATCH (i:Ingredient) WHERE i.inci_name = 'NIACINAMIDE'
    OPTIONAL MATCH (c:Company)-[:SUPPLIES]->(i)
    RETURN i.inci_name AS inci, i.cas_primary AS cas, count(c) AS suppliers
  expect_min: 1
  expect_contains: [NIACINAMIDE]
  coverage_gap: >
    SUPPLIES needs S14 (company websites) or a raw-material distributor source; the
    ingredient itself resolves, the supplier edge does not exist yet.

- id: loan_licence_holders
  q: "Companies holding a loan licence (COS-9)"
  shape: Licence{form_type:'COS-9'}
  cypher: |
    MATCH (f:Facility)-[:LICENSED_UNDER]->(l:Licence {form_type:'COS-9'})
    OPTIONAL MATCH (c:Company)-[:OPERATES]->(f)
    RETURN l.number AS licence, f.firm_name AS premises, c.legal_name AS company
  expect_min: 1

- id: eu_restricted_ingredients
  q: "Ingredients prohibited in the EU"
  shape: Ingredient->RegulatoryRule
  cypher: |
    MATCH (i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule)
    WHERE r.jurisdiction = 'EU' AND r.status = 'prohibited'
    RETURN count(DISTINCT i) AS n
  expect_min: 500

- id: india_category_standards
  q: "Which BIS standard applies to skin creams?"
  shape: ProductCategory->RegulatoryRule
  cypher: |
    MATCH (p:ProductCategory)-[:GOVERNED_BY]->(r:RegulatoryRule)
    WHERE r.jurisdiction = 'IN' AND r.standard_ref IS NOT NULL
    RETURN p.code AS category, collect(DISTINCT r.standard_ref) AS standards
    ORDER BY category
  expect_min: 10

- id: india_ingredient_restrictions
  q: "Ingredient restrictions that apply in India"
  shape: Ingredient->RegulatoryRule{jurisdiction:'IN'}
  cypher: |
    MATCH (i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule {jurisdiction:'IN'})
    RETURN i.inci_name AS ingredient, r.clause AS clause, r.status AS status,
           r.max_concentration AS max_conc
    ORDER BY ingredient
  expect_min: 5

- id: jurisdiction_never_leaks
  q: "An India-scoped restriction query must never return an EU rule"
  shape: negative test
  cypher: |
    MATCH (i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule)
    WHERE r.jurisdiction = 'IN'
    RETURN count(CASE WHEN r.jurisdiction <> 'IN' THEN 1 END) AS leaks
  expect_zero: leaks

- id: every_rule_has_jurisdiction
  q: "Every RegulatoryRule carries a jurisdiction (hard rule 2)"
  shape: invariant
  cypher: |
    MATCH (r:RegulatoryRule)
    WHERE r.jurisdiction IS NULL OR NOT r.jurisdiction IN ['IN','EU']
    RETURN count(r) AS violations
  expect_zero: violations

- id: no_person_nodes
  q: "No Person node exists (hard rule 4)"
  shape: invariant
  cypher: "MATCH (n:Person) RETURN count(n) AS violations"
  expect_zero: violations

# The graph is readable by the agent's own Cypher, so it is a public surface. A GSTIN on
# a personal PAN (proprietorship P, HUF H — PAN char 4) carries a person's PAN; it is
# masked in `gstins`, absent from `pan`, and masked in `trust_reasons`. This query once
# would have found 13: the reasons printed every GSTIN in full.
- id: no_personal_pan_in_graph
  q: "No person's PAN is readable from a Company node (DPDP)"
  shape: invariant
  cypher: |
    MATCH (c:Company)
    WHERE any(g IN coalesce(c.gstins, []) WHERE g =~ '[0-9]{2}[A-Z]{3}[PH][A-Z][0-9]{4}[A-Z].*')
       OR c.pan =~ '[A-Z]{3}[PH][A-Z][0-9]{4}[A-Z]'
       OR any(r IN coalesce(c.trust_reasons, []) WHERE r =~ '.*[A-Z]{3}[PH][A-Z][0-9]{4}[A-Z].*')
       OR any(r IN coalesce(c.trust_lines, []) WHERE r =~ '.*[A-Z]{3}[PH][A-Z][0-9]{4}[A-Z].*')
    RETURN count(c) AS violations
  expect_zero: violations

# decisions/0029. A phone or email is shown only where it reaches the firm. A sole trader's
# number and address are his own; they stay in Postgres, never on a Company node.
- id: no_contact_for_a_sole_trader
  q: "No proprietorship or HUF carries a phone or email in the graph (DPDP)"
  shape: invariant
  cypher: |
    MATCH (c:Company)
    WHERE (c.phone IS NOT NULL OR c.email IS NOT NULL)
      AND (c.is_proprietorship = true
           OR any(g IN coalesce(c.gstins, []) WHERE g CONTAINS '•'))
    RETURN count(c) AS violations
  expect_zero: violations

# Registry membership is rung-1 evidence. The national Udyam adapter once never set the
# flag, leaving 119,120 registered firms at L0 — this catches the trust side of that.
- id: udyam_registration_reaches_trust
  q: "Every Udyam-registered company has rung 1"
  shape: invariant
  cypher: |
    MATCH (c:Company) WHERE c.udyam_registered = true
      AND NOT 1 IN coalesce(c.trust_rungs, [])
    RETURN count(c) AS violations
  expect_zero: violations

# TRUST_PLAN §2.8. The ladder let 3,408 firms reach L4 "corroborated" with no identity
# evidence at all: council membership alone counted. Corroboration now needs identity.
- id: corroboration_requires_identity
  q: "No company is corroborated (rung 4) without legal-existence evidence (rung 1)"
  shape: invariant
  cypher: |
    MATCH (c:Company) WHERE 4 IN coalesce(c.trust_rungs, [])
      AND NOT 1 IN coalesce(c.trust_rungs, [])
    RETURN count(c) AS violations
  expect_zero: violations

- id: every_edge_has_provenance
  q: "Every relationship carries provenance (hard rule 9)"
  shape: invariant
  cypher: |
    MATCH ()-[r]->()
    WHERE r._source_id IS NULL AND r._prov IS NULL
    RETURN count(r) AS violations
  expect_zero: violations

- id: orphan_facilities
  q: "No Facility without a licence or a cluster"
  shape: referential
  cypher: |
    MATCH (f:Facility)
    WHERE NOT (f)-[:LICENSED_UNDER]->() AND NOT (f)-[:LOCATED_IN]->()
    RETURN count(f) AS violations
  expect_zero: violations

- id: orphan_licences
  q: "No Licence detached from a facility"
  shape: referential
  cypher: |
    MATCH (l:Licence) WHERE NOT ()-[:LICENSED_UNDER]->(l)
    RETURN count(l) AS violations
  expect_zero: violations

- id: cosmetics_firms_in_wedge_clusters
  q: "Cosmetics-active companies per wedge cluster"
  shape: Company->Cluster
  cypher: |
    MATCH (c:Company)-[:LOCATED_IN]->(cl:Cluster {wedge:true})
    RETURN cl.name AS cluster, count(DISTINCT c) AS companies
    ORDER BY companies DESC
  expect_min: 1

- id: tier4_never_answers_compliance
  q: "No PERMITS or RESTRICTED_BY edge is tier 4 (hard rule 3)"
  shape: invariant
  cypher: |
    MATCH ()-[r:PERMITS|RESTRICTED_BY|LICENSED_UNDER]->()
    WHERE r._tier = 4
    RETURN count(r) AS violations
  expect_zero: violations

- id: trust_level_on_every_company
  q: "Every Company carries a computed trust level"
  shape: invariant
  cypher: |
    MATCH (c:Company) WHERE c.trust_level IS NULL RETURN count(c) AS violations
  expect_zero: violations

- id: trust_grade_on_every_company
  q: "Every Company carries an evidence grade (TRUST_PLAN §6.1)"
  shape: invariant
  cypher: |
    MATCH (c:Company)
    WHERE NOT c.trust_grade IN ['flagged', 'G0', 'G1', 'G2', 'G3', 'G4']
       OR c.trust_licence IS NULL OR c.trust_activity IS NULL OR c.trust_track IS NULL
    RETURN count(c) AS violations
  expect_zero: violations

# TRUST_PLAN §7.1. The agent's Cypher can read anything on a Company node, so a private
# trust fact on one is a published fact. Filing history above all (hard rule 7).
- id: no_private_trust_fields_in_neo4j
  q: "No private trust or GST-filing field is on a Company node"
  shape: invariant
  cypher: |
    MATCH (c:Company)
    WHERE any(k IN keys(c) WHERE k IN ['last_gstr1_period', 'last_gstr3b_period',
             'filing_streak_mo', 'filing_streak_months', 'filing_on_schedule',
             'filing_frequency', 'gst_filing', 'einvoice_enabled_private'])
    RETURN count(c) AS violations
  expect_zero: violations

- id: substitutes_for_a_restricted_ingredient
  q: "Alternatives to a restricted ingredient sharing its declared function"
  shape: Ingredient-[:SUBSTITUTE_FOR]->Ingredient
  cypher: |
    MATCH (i:Ingredient)-[e:SUBSTITUTE_FOR]->(alt:Ingredient)
    RETURN i.inci_name AS restricted, collect(alt.inci_name)[0..3] AS alternatives
    LIMIT 5
  expect_min: 0
  coverage_gap: "Run `make derive` without --skip-substitutes to populate."

- id: eu_restricted_ingredient_in_an_indian_product
  q: "Ingredients restricted or prohibited in the EU that appear in products on Indian shelves"
  shape: Product->Ingredient->RegulatoryRule
  cypher: |
    MATCH (p:Product)-[:CONTAINS]->(i:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule)
    WHERE r.jurisdiction = 'EU'
      AND NOT EXISTS { (i)-[:RESTRICTED_BY]->(:RegulatoryRule {jurisdiction:'IN'}) }
      AND NOT coalesce(r.applies_to_group, false)
    RETURN i.inci_name AS ingredient, r.clause AS eu_clause, r.status AS eu_status,
           'EU_ONLY — no equivalent India rule in the graph' AS jurisdiction_note,
           count(DISTINCT p) AS indian_products
    ORDER BY indian_products DESC LIMIT 10
  expect_min: 1
  coverage_gap: >
    Open Beauty Facts carries 1,751 Indian products but only 287 with usable ingredient
    text; this is observed shelf data (tier 3), not market coverage.

- id: indian_products_by_category
  q: "Observed Indian products per regulator category"
  shape: Product->ProductCategory
  cypher: |
    MATCH (p:Product)-[:IN_CATEGORY]->(c:ProductCategory)
    RETURN c.code AS category, count(p) AS products ORDER BY products DESC
  expect_min: 0
  coverage_gap: "Depends on Open Beauty Facts category tags being present on Indian rows."

- id: supplier_of_a_named_ingredient
  q: "Which Indian companies list a given ingredient on their own site?"
  shape: Company-[:SUPPLIES]->Ingredient
  cypher: |
    MATCH (c:Company)-[e:SUPPLIES]->(i:Ingredient)
    WHERE e.cosmetics_relevant
    RETURN i.inci_name AS ingredient, count(DISTINCT c) AS suppliers
    ORDER BY suppliers DESC LIMIT 10
  expect_min: 0
  coverage_gap: "Populated by S14b from landed company pages; grows with the S14 crawl."

- id: trust_rungs_are_not_a_quality_ordering
  q: "Companies with licence evidence (L2) specifically, not merely a high trust_level"
  shape: invariant + coverage
  cypher: |
    MATCH (c:Company)
    RETURN count(CASE WHEN 2 IN c.trust_rungs THEN 1 END) AS with_licence_evidence,
           count(CASE WHEN 4 IN c.trust_rungs THEN 1 END) AS corroborated_only_evidence,
           count(CASE WHEN c.trust_rungs IS NULL THEN 1 END) AS missing_rungs
  expect_min: 1
  coverage_gap: >
    with_licence_evidence is the number that matters for a factory recommendation and it
    is near zero until a state COS-8/COS-9 extract exists. Filter on `2 IN trust_rungs`,
    never on `trust_level >= 2`.

- id: packaging_converters_in_a_wedge_cluster
  q: "Who can pack it? Packaging converters by component type in a wedge cluster"
  shape: Company->PackagingComponent + Company->Cluster
  cypher: |
    MATCH (c:Company)-[:SUPPLIES_PACKAGING]->(p:PackagingComponent)
    MATCH (c)-[:LOCATED_IN]->(cl:Cluster {wedge:true})
    RETURN cl.name AS cluster, p.type AS component, count(DISTINCT c) AS converters
    ORDER BY converters DESC LIMIT 12
  expect_min: 1

- id: doc_index_is_linked_and_citable
  q: "Rule text is indexed, embedded, and cites the rules it supports"
  shape: RegulatoryRule-[:SUPPORTED_BY]->DocChunk
  cypher: |
    MATCH (d:DocChunk)
    RETURN count(d) AS chunks,
           count(CASE WHEN d.embedding IS NOT NULL THEN 1 END) AS embedded,
           count(CASE WHEN EXISTS { (d)-[:MENTIONS]->() } THEN 1 END) AS linked,
           count(CASE WHEN EXISTS { (:RegulatoryRule)-[:SUPPORTED_BY]->(d) } THEN 1 END) AS cited
  expect_min: 1

- id: vector_search_returns_node_linked_chunks
  q: "Vector search over the doc index returns chunks that are linked to graph entities"
  shape: DocChunk vector index
  cypher: |
    MATCH (d:DocChunk)-[:MENTIONS]->(e)
    RETURN labels(e)[0] AS entity_type, count(DISTINCT d) AS chunks
    ORDER BY chunks DESC
  expect_min: 1

- id: packaging_converters_across_wedge_clusters
  q: "Packaging converters now present in more than one wedge cluster (national Udyam)"
  shape: Company-[:SUPPLIES_PACKAGING]->PackagingComponent + Company->Cluster
  cypher: |
    MATCH (c:Company)-[:SUPPLIES_PACKAGING]->(p:PackagingComponent)
    MATCH (c)-[:LOCATED_IN]->(cl:Cluster {wedge: true})
    RETURN cl.name AS cluster, count(DISTINCT c) AS converters,
           count(DISTINCT p.type) AS component_types
    ORDER BY converters DESC
  expect_min: 1
  coverage_gap: >
    Was Gujarat-only while Udyam came from a local parquet extract; the national
    data.gov.in registry (S17b) sweeps every wedge-cluster pincode.

- id: packaging_never_typed_from_construction_or_sheet_glass
  q: "No packaging edge may rest on a NIC code whose registry text is not packaging"
  shape: invariant
  cypher: |
    MATCH ()-[e:SUPPLIES_PACKAGING]->(p:PackagingComponent)
    WHERE p.type IN ['glass_primary', 'metal_formed', 'metal_coated']
    RETURN count(e) AS violations
  expect_zero: violations
  note: >
    23101 (sheet glass), 25910 (forging) and 25920 (machining) were typed as packaging,
    and 23109 (construction and optical glass) fed every glass_container edge.
    decisions/0027.

- id: cosmetics_firms_outside_gujarat
  q: "Cosmetics manufacturers in the Himachal and Uttarakhand wedge clusters"
  shape: Company->Cluster
  cypher: |
    MATCH (c:Company)-[:LOCATED_IN]->(cl:Cluster)
    WHERE cl.cluster_id IN ['HP_BBN','UK_HARIDWAR_SELAQUI']
      AND ('cosmetics_core' IN c.roles OR 'manufacturer_candidate' IN c.roles)
    RETURN cl.name AS cluster, count(DISTINCT c) AS firms
    ORDER BY firms DESC
  expect_min: 1
  coverage_gap: "Zero before S17b — the parquet extract covered Gujarat only."

- id: accredited_cosmetics_testing_labs
  q: "Labs accredited by NABL specifically for cosmetics testing"
  shape: Company-[:ACCREDITED_AS]->Certification
  cypher: |
    MATCH (c:Company)-[a:ACCREDITED_AS]->(ce:Certification)
    WHERE a.tests_cosmetics
    RETURN count(DISTINCT c) AS cosmetics_labs
  expect_min: 1

- id: every_lab_carries_the_testing_lab_role
  q: "Every accredited lab is labelled as one, and the role array stays additive"
  shape: invariant
  cypher: |
    MATCH (c:Company)-[:ACCREDITED_AS]->(:Certification)
    WHERE NOT 'testing_lab' IN c.roles
    RETURN count(c) AS violations
  expect_zero: violations
  note: >
    Deliberately NOT asserting that a lab is never a manufacturer. Many pharma and
    chemical firms hold an in-house NABL accreditation for their own QC, and roles[] is
    additive by design (hard rule 11) — a company can be both. NABL does record an
    In-House / Open to Others distinction, but it is NOT exposed in the public results
    grid, so this graph cannot yet tell a buyer whether a lab accepts outside work.

- id: restricted_by_never_carries_a_blanket_note
  q: "RESTRICTED_BY must only ever reach substance-specific rules"
  shape: invariant
  cypher: |
    MATCH (:Ingredient)-[:RESTRICTED_BY]->(r:RegulatoryRule)
    WHERE coalesce(r.applies_to_group, false)
    RETURN count(r) AS violations
  expect_zero: violations
  note: >
    Enforced in the LOADER, not in each query, so any consumer — the agent, ad-hoc
    Cypher, a future template — is safe without knowing to filter.
- id: loan_licence_pairs_are_undirected
  q: "Firms tied to each other by a loan licence, with no direction claimed"
  shape: Company-[:LOAN_LICENCE_WITH]->Company
  cypher: |
    MATCH (a:Company)-[e:LOAN_LICENCE_WITH]->(b:Company)
    WHERE e.direction_known = false
    RETURN a.legal_name AS company, b.legal_name AS partner,
           e.licence_form AS form, e.regime AS regime
  expect_min: 10

- id: cosmetics_licences_are_separable_from_drug_licences
  q: "Cosmetics-regime licences only — the register is overwhelmingly pharma"
  shape: Licence{regime:'cosmetics'}
  cypher: |
    MATCH (l:Licence) WHERE l.regime = 'cosmetics'
    RETURN l.form_type AS form, l.number AS number, l.sla_state AS state
  expect_min: 1

- id: glycerin_has_suppliers
  q: "Who supplies glycerin? (asked 2026-10-08 and answered with nothing)"
  shape: Company-[:SUPPLIES]->Ingredient
  cypher: |
    MATCH (c:Company)-[e:SUPPLIES]->(i:Ingredient {inci_name: 'GLYCERIN'})
    RETURN c.legal_name AS supplier, e._tier AS tier, e.matched AS matched_on
  expect_min: 1
  coverage_gap: >
    GLYCERIN was excluded as "ambiguous" and the matcher knew no synonym, so "Glycerine
    IP" on a catalogue page matched nothing. decisions/0018. Tier 3: a lead, not stock.
