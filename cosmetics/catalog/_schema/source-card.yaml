# Schema for catalog/sources/*.yaml — one card per acquired source.
# Hand-written fields carry judgement; `volume`, `acquisition.payloads/bytes/first_seen/last_seen`
# and `graph` are REGENERATED by `make catalog-refresh` and must not be hand-edited.
#
# Read this file before writing or trusting a source card.

id:            str   # sNN, matches adapters/sNN_*.py and raw/sNN_*/
slug:          str   # short name used in paths
name:          str   # full human name
tier:          int   # 1 regulator | 2 company-declared | 3 observed/scraped | 4 inferred
status:        enum  # live | stub | blocked | no_bulk_source | not_built
jurisdiction:  str   # IN | EU | -

what_it_is:       str    # one plain-English paragraph, no jargon
what_it_answers:  [str]  # the questions this source makes answerable

publisher:
  org:     str
  url:     str
  access:  enum  # public | key_required | login_required | none
  family:  str   # who actually publishes the rows; sources sharing one count once for trust
  kind:    enum  # registry | directory | self | reference  (TRUST_PLAN §6.2)
  family_split_by: str  # optional: a payload field naming the real publisher (s08: event)

acquisition:
  adapter:   str   # path, or null if not built
  method:    enum  # json_api | html_crawl | pdf | bulk_file | none
  landed_at: str   # raw/ path
  # --- generated below ---
  payloads:   int
  bytes:      int
  first_seen: date
  last_seen:  date
  refresh:
    cadence: enum  # quarterly | annual | on_demand | never
    why:     str

volume:        # --- generated ---
  raw_rows: int
  graph:    {label_or_reltype: int}

coverage:
  claimed:  int   # what the publisher says exists
  obtained: int   # what we hold
  pct:      float
  note:     str   # why the gap, if any

defects: [str]    # known problems, found by building it. Be specific; cite the row.

feeds:
  nodes: [str]
  edges: [str]

do_not: [str]     # guardrails. An agent answering from this source MUST respect these.

# Store keys this card is measured against by `make catalog-check`.
# REQUIRED on every card — a card without it cannot be checked and the drift run says so.
# Name the keys explicitly; never let the checker guess them from `id`. `s17` prefix-matches
# `s17b_udyam_api`, which would silently compare the Gujarat card against the national figure.
# null means "this source has no row in that store" and that field is skipped.
keys:
  raw_company:    str|null   # source_id in public.raw_company     -> checks volume.raw_rows
  fetch_manifest: str|null   # source_id in public.fetch_manifest  -> checks acquisition.payloads/first_seen/last_seen
  raw_dir:        str|null   # directory name under raw/           -> checks acquisition.bytes
