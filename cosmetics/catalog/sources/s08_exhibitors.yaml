jurisdiction: IN

what_it_is: >
  Who paid for a stand at a cosmetics trade fair. A small source with a sharp signal:
  exhibiting is expensive and discretionary, so it is decent evidence a firm is actively
  selling into cosmetics right now — which a registry entry is not.

what_it_answers:
  - "Is this firm actively trading in cosmetics, or just registered?"
  - "Who showed up at this event?"

