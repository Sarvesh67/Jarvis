id: s02
slug: state_fda
name: State FDA / ONDLS cosmetics licences (COS-8 / COS-9)
tier: 1
status: no_bulk_source
jurisdiction: IN

what_it_is: >
  The actual Indian cosmetics manufacturing licence. Issued by state FDAs, not CDSCO.
  This is the single most important missing source in the project: it is the only tier-1
  answer to "is this firm licensed to make cosmetics", and S1 does not substitute for it.

what_it_answers:
  - "Does this firm hold a COS-8 (manufacture) or COS-9 (loan) licence?"
  - "Which categories does that licence permit?"

