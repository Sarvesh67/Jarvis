what_it_is: >
  Marketplace listings and trade data. Enrichment only — price points, MOQs, what is
  actually being offered rather than what is registered. Grouped here with S12/S13 from
  the build spec, none of which are built.

what_it_answers:
  - "What is this firm actually offering for sale, at what price and MOQ?"

