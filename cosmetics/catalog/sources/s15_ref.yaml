id: s15
slug: ref
name: GeoNames pincode reference
tier: 1
status: live
jurisdiction: IN

what_it_is: >
  A plain lookup table: pincode -> district -> state, and since 2026-10-29 the pincode's
  location (the centroid of every GeoNames place listed under it) and all those place
  names. Unglamorous and load-bearing. Every address in every other source is a free-text
  string; this is what turns it into a place, and therefore what makes clusters,
  proximity and "who is near whom" answerable at all (decisions/0028).

what_it_answers:
  - "Where is this pincode, and which district and state is it in?"
  - "Which cluster does this address fall in?"
  - "Which suppliers are nearest to this pincode, district or town?"

publisher:
  org: GeoNames
  url: https://download.geonames.org/export/zip/
  access: public

acquisition:
  adapter: adapters/s15_reference.py
  method: bulk_file
  landed_at: raw/s15_ref/
  payloads: 2
  bytes: 3485781
  first_seen: 2026-09-05
  last_seen: 2026-10-29
  refresh:
    cadence: annual
    why: Pincodes are stable; district boundaries occasionally split.

volume:
  raw_rows: 19238
  graph:
    Cluster: 17

coverage:
  claimed: 19238
  obtained: 19238
  pct: 100.0
  note: Complete for the published file.

defects:
  - >
    A pincode's location is the centroid of its GeoNames places, which can sit 10-20 km
    from the town people mean (Baddi lands ~17 km west of the industrial area). Good for
    ranking a shortlist, never for quoting a distance as fact.
  - >
    GeoNames districts are partly pre-bifurcation: Dahej is filed under Vadodara, not
    Bharuch, and neighbouring pincodes of one town can sit in two districts. Place lookup
    treats candidates within 50 km of each other as one place, and refuses a name that is
    genuinely several places ("Tarapur": Palghar, Anand, Surat, Cachar).

feeds:
  nodes: [Cluster]
  edges: [LOCATED_IN]
  properties: [Company.location, Company.lat, Company.lon]

do_not:
  - >
    Do not resolve a district by name alone across states — see the Raigarh/Raigad trap
    in s17b_udyam.yaml and decisions/0008.

# Store keys this card is measured against by `make catalog-check`.
# null = this source has no row there, and that field is not checked.
keys:
  raw_company: null
  fetch_manifest: s15_ref
  raw_dir: s15_ref
