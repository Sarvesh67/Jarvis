what_it_is: >
  A crowd-sourced product database. Its value here is not the products but the alias
  table: the many ways a real-world label writes the same ingredient. It is the bridge
  between messy consumer-facing strings and CosIng's canonical INCI names.

what_it_answers:
  - "Is this label string an alias for a known INCI name?"
  - "What ingredients typically appear in this product type?"

publisher:
  org: Open Food Facts / Open Beauty Facts
  url: https://world.openbeautyfacts.org/data
